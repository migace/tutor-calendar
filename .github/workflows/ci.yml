name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutor
          POSTGRES_PASSWORD: tutor
          POSTGRES_DB: tutor_calendar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tutor -d tutor_calendar"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TC_DATABASE_URL: postgresql+asyncpg://tutor:tutor@localhost:5432/tutor_calendar
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      # CI=true makes the integration tests fail, not skip, without a database.
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: The deployable image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tutor-calendar .
      - name: The demo Compose file is valid
        run: docker compose -f docker-compose.demo.yml --env-file demo.env.example config --quiet
        env:
          # The example file leaves the two secrets empty on purpose.
          TC_SECRET_KEY: not-a-secret-only-for-validating-the-file
          POSTGRES_PASSWORD: notasecret

  api-contract:
    name: Generated API types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run python -m tutor_calendar.api.export_openapi ../frontend/openapi.json
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm gen:api
        working-directory: frontend
      - name: Fail if the committed contract differs from the code
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  e2e:
    name: A booking goes through in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # No browser image to keep in step with the package: each Playwright
      # downloads the one browser build it was tested with, and the download
      # is kept under that Playwright's version.
      - name: Which Playwright is installed
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # With the download restored, this only installs the libraries the browser needs.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Build the image and start it with its database, its worker and Mailpit
        run: docker compose up --build --detach --wait
        working-directory: .
      # The same address the browser will use, from outside the containers.
      - name: Wait until it is ready
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 30 --retry-delay 1 --retry-all-errors
          http://localhost:8000/health/ready
      - run: pnpm test
      - name: Collect the containers' logs
        if: failure()
        run: |
          mkdir -p e2e/test-results
          docker compose logs --no-color --timestamps > e2e/test-results/containers.log
        working-directory: .
      # A trace of each failed journey, to open with `playwright show-trace`.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure
          path: e2e/test-results/
          retention-days: 7
