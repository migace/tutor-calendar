# One grouped pull request a month for each place a version is pinned.
# Security updates do not wait for the schedule.
version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is a new compiler: typescript-eslint refuses to run on
      # it and openapi-typescript fails to load. Take it when both do.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types follow the Node that CI and the image run, which is 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Playwright is pinned to an exact version, and that version decides which
  # browser build CI downloads, so there is no second place to update.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      e2e:
        patterns: ["*"]
    ignore:
      # Both for the reasons given under /frontend.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ["*"]
    ignore:
      # A new Python or Node line is a decision, taken together with
      # requires-python and the version CI runs, not an update to accept.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      compose:
        patterns: ["*"]
    ignore:
      # A new PostgreSQL major needs its data directory upgraded first.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
