# `docker compose up -d db`    PostgreSQL only, for running the backend from your shell
# `docker compose up --build`  everything: PostgreSQL, the API (migrates and adds a demo
#                              tutor on start), the worker, and Mailpit to catch its mail
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: tutor_calendar
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor_calendar"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      TC_DATABASE_URL: postgresql+asyncpg://tutor:tutor@db:5432/tutor_calendar
      # For local use only, so that booking links survive a restart of the container.
      TC_SECRET_KEY: local-development-only-not-a-real-secret
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Without this, `docker compose up --wait` returns while migrations are still running.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    build: ./backend
    command: ["python", "-m", "tutor_calendar.worker"]
    environment:
      TC_DATABASE_URL: postgresql+asyncpg://tutor:tutor@db:5432/tutor_calendar
      # The same key as the API, or the links in reminders could not be opened.
      TC_SECRET_KEY: local-development-only-not-a-real-secret
      TC_SMTP_HOST: mailpit
      TC_SMTP_PORT: "1025"
      TC_SMTP_STARTTLS: "false"
      TC_WORKER_INTERVAL_SECONDS: "5"
    depends_on:
      # The API runs the migrations; the worker needs the tables they create.
      api:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Catches all outgoing mail. Read it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db-data:
