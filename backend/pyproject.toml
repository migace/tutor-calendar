[project]
name = "tutor-calendar"
version = "0.5.0"
description = "Booking calendar for independent tutors"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "pydantic[email]>=2.8",
    "sqlalchemy[asyncio]>=2.0.30",
    # Windows and slim containers ship no IANA database; zoneinfo falls back to this.
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4",
    "httpx2>=2.16.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running PostgreSQL (skipped locally when unreachable, required in CI)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "DTZ", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
